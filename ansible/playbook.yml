---
# Ansible playbook: Kubernetes + Calico VXLAN installation (Calico v3.29.1)
# Modified to deploy Calico in VXLAN overlay, IPPool 10.233.64.0/18, blockSize /26, natOutgoing: true
# - applies the Calico v3.29 manifest
# - patches the calico-node DaemonSet to fix FELIX_VXLANVNI / FELIX_VXLANPORT
# - creates a custom Calico IPPool (vxlanMode: Always, ipipMode: Never, blockSize: 26)

# 1. Preparation of all nodes (master + workers)
- name: Prepare Kubernetes nodes
  hosts: all
  become: true
  vars:
    kubernetes_version: "1.29"              # recent stable version
    kubeadm_kubernetes_version: "1.29.0-*"  # format for apt packages
    pod_network_cidr: "10.233.64.0/18"      # for Calico (CNI) - corresponds to requested functional cluster
    # Default global value, usable if not redefined below
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/v3.29.0/manifests/calico.yaml"
  tasks:
    - name: Do nothing on the ansible-01 machine
      ansible.builtin.meta: end_host
      when: inventory_hostname == "ansible-01"

    - name: Disable swap (runtime)
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0

    - name: Comment out swap in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Load required kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules persistence
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Kubernetes sysctl parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: '0644'

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    # ------- containerd installation -------
    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Backup any existing containerd config
      ansible.builtin.copy:
        src: /etc/containerd/config.toml
        dest: /etc/containerd/config.toml.bak
        remote_src: true
      ignore_errors: true

    - name: Generate a default containerd config (with CRI enabled)
      ansible.builtin.command: >
        bash -c "containerd config default > /etc/containerd/config.toml"

    - name: Force SystemdCgroup to true in containerd config
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Ensure the CRI plugin is not disabled
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins *=.*'
        replace: 'disabled_plugins = []'
      ignore_errors: true

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true

    # ------- kubeadm/kubelet/kubectl installation -------
    - name: Add Kubernetes repository GPG key
      ansible.builtin.apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key
        state: present

    - name: Add Kubernetes repository
      ansible.builtin.apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubeadm_kubernetes_version }}"
          - "kubeadm={{ kubeadm_kubernetes_version }}"
          - "kubectl={{ kubeadm_kubernetes_version }}"
        state: present
        update_cache: true

    - name: Mark Kubernetes packages as hold
      ansible.builtin.command: >
        apt-mark hold kubelet kubeadm kubectl


# 2. Master initialization
- name: Initialize Kubernetes master
  hosts: k8s-master-01
  become: true
  vars:
    pod_network_cidr: "{{ hostvars['k8s-master-01']['pod_network_cidr'] | default('10.233.64.0/18') }}"
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/v3.29.0/manifests/calico.yaml"
  tasks:
    - name: Initialize the control-plane with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Create .kube folder for ubuntu
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0700'

    - name: Copy admin.conf file
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        remote_src: true

    - name: Retrieve the join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_cmd

    - name: Register the join command as a fact
      ansible.builtin.set_fact:
        join_command: "{{ kubeadm_join_cmd.stdout }}"

# ------- Prepare nodes for Calico -------
- name: Prepare nodes for Calico (create hostPath + pre-pull images)
  hosts: all
  become: true
  tasks:
    - name: Do nothing on ansible-01
      ansible.builtin.meta: end_host
      when: inventory_hostname == "ansible-01"

    - name: Create hostPath required by Calico (idempotent)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /var/lib/calico
        - /var/run/calico
        - /var/run/bird
        - /var/run/nodeagent
        - /var/log/calico/cni
        - /opt/cni/bin
        - /var/lib/cni/networks
        - /etc/cni/net.d

    - name: Pre-pull Calico and local-path images if possible
      ansible.builtin.shell: |
        if command -v crictl >/dev/null 2>&1; then
          crictl pull docker.io/calico/cni:v3.29.0 || true
          crictl pull docker.io/calico/node:v3.29.0 || true
          crictl pull docker.io/rancher/local-path-provisioner:v0.0.32 || true
        elif command -v ctr >/dev/null 2>&1; then
          ctr -n k8s.io images pull docker.io/calico/cni:v3.29.0 || true
          ctr -n k8s.io images pull docker.io/calico/node:v3.29.0 || true
          ctr -n k8s.io images pull docker.io/rancher/local-path-provisioner:v0.0.32 || true
        elif command -v docker >/dev/null 2>&1; then
          docker pull docker.io/calico/cni:v3.29.0 || true
          docker pull docker.io/calico/node:v3.29.0 || true
          docker pull docker.io/rancher/local-path-provisioner:v0.0.32 || true
        else
          echo "No supported runtime found for pre-pull" >&2
        fi
      args:
        warn: false

    - name: Wait 5s for hostPath propagation on nodes
      ansible.builtin.pause:
        seconds: 5
      when: inventory_hostname == "k8s-master-01"

# ------- Install Calico CNI (only on master) -------
- name: Install and configure Calico CNI
  hosts: k8s-master-01
  become: true
  vars:
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/v3.29.0/manifests/calico.yaml"
  tasks:
    - name: Download Calico v3.29 manifest
      ansible.builtin.get_url:
        url: "{{ calico_manifest_url }}"
        dest: /tmp/calico-v3.29.yaml
        mode: '0644'

    - name: Apply Calico v3.29 manifest
      become: true
      become_user: ubuntu
      ansible.builtin.command: >
        kubectl apply -f /tmp/calico-v3.29.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Wait for calico-node DaemonSet ready
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n kube-system rollout status daemonset/calico-node --timeout=180s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Fix FELIX_VXLANVNI and FELIX_VXLANPORT environment variables on calico-node
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n kube-system set env daemonset/calico-node FELIX_VXLANVNI=4096 FELIX_VXLANPORT=4789
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Wait for Calico CRDs to be available
      become_user: ubuntu
      ansible.builtin.shell: |
        for i in {1..40}; do
          if kubectl api-resources | grep -q "ippools.*projectcalico"; then
            echo "IPPool resource is available in API"
            exit 0
          fi
          echo "Waiting for IPPool resource in API... (attempt $i/40)"
          sleep 2
        done
        echo "Timeout waiting for IPPool API resource"
        exit 1
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      retries: 3
      delay: 5

    - name: Wait for IPPool CRD to be established (Established condition)
      become_user: ubuntu
      ansible.builtin.shell: |
        for i in {1..30}; do
          STATUS=$(kubectl get crd ippools.crd.projectcalico.org -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null)
          if [ "$STATUS" = "True" ]; then
            echo "IPPool CRD is Established"
            exit 0
          fi
          echo "Waiting for IPPool CRD to be Established... (attempt $i/30)"
          sleep 2
        done
        exit 1
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Invalidate kubectl discovery cache
      become_user: ubuntu
      ansible.builtin.shell: |
        rm -rf ~/.kube/cache/discovery
        kubectl api-resources > /dev/null 2>&1
        sleep 3
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Create IPPool manifest file
      ansible.builtin.copy:
        dest: /tmp/calico-ippool.yaml
        content: |
          apiVersion: crd.projectcalico.org/v1
          kind: IPPool
          metadata:
            name: default-ipv4-ippool
          spec:
            cidr: 10.233.64.0/18
            ipipMode: Never
            vxlanMode: Always
            natOutgoing: true
            blockSize: 26
            nodeSelector: all()
        mode: '0644'

    - name: Apply Calico IPPool (VXLAN overlay, /18 cidr, /26 blocks, natOutgoing true)
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl apply -f /tmp/calico-ippool.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: ippool_result
      retries: 5
      delay: 10
      until: ippool_result.rc == 0

    - name: Verify that IPPool was created successfully
      become_user: ubuntu
      ansible.builtin.command: kubectl get ippool default-ipv4-ippool -o yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: ippool_check
      failed_when: "'default-ipv4-ippool' not in ippool_check.stdout"

# 3. Join workers to cluster
- name: Add workers to the cluster
  hosts: all
  become: true
  vars:
    master_host: "k8s-master-01"
  tasks:
    - name: Do nothing on ansible-01 and on master
      ansible.builtin.meta: end_host
      when: inventory_hostname in ["ansible-01", master_host]

    - name: Execute kubeadm join
      ansible.builtin.command: "{{ hostvars[master_host].join_command }} --v=5"
      args:
        creates: /etc/kubernetes/kubelet.conf


# 4. Install Helm on master once workers have joined
- name: Install Helm on master
  hosts: k8s-master-01
  become: true
  tasks:
    - name: Install Helm (latest version) if absent
      ansible.builtin.shell: |
        LATEST_TAG=$(curl -s https://api.github.com/repos/helm/helm/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        curl -Lo helm.tar.gz "https://get.helm.sh/helm-${LATEST_TAG}-linux-amd64.tar.gz"
        tar -zxvf helm.tar.gz
        mv linux-amd64/helm /usr/local/bin/helm
        chmod +x /usr/local/bin/helm
        rm -rf helm.tar.gz linux-amd64
      args:
        creates: /usr/local/bin/helm

    - name: Check if local-path StorageClass exists
      become_user: ubuntu
      ansible.builtin.shell: kubectl get storageclass local-path -o name
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: local_path_sc
      failed_when: false
      changed_when: false
      run_once: true
      when: inventory_hostname == "k8s-master-01"

    - name: Download local-path-provisioner manifest
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml"
        dest: /tmp/local-path-storage.yaml
        mode: '0644'
      run_once: true
      when: inventory_hostname == "k8s-master-01"

    - name: Modify reclaimPolicy in local-path manifest to Retain
      become: true
      ansible.builtin.replace:
        path: /tmp/local-path-storage.yaml
        regexp: 'reclaimPolicy:\s*Delete'
        replace: 'reclaimPolicy: Retain'
        backup: yes
      run_once: true
      when: inventory_hostname == "k8s-master-01"

    - name: Verify reclaimPolicy has been modified in local-path manifest
      become: true
      ansible.builtin.shell: grep -E "reclaimPolicy:\s*Retain" /tmp/local-path-storage.yaml
      register: sc_check
      failed_when: sc_check.rc != 0
      run_once: true
      when: inventory_hostname == "k8s-master-01"

    - name: Install local-path provisioner (Rancher) if absent (apply modified manifest)
      become_user: ubuntu
      ansible.builtin.command: >
        kubectl apply -f /tmp/local-path-storage.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: local_path_sc.rc != 0 and inventory_hostname == "k8s-master-01"
      run_once: true

    - name: Force local-path-provisioner deployment image to v0.0.32 (idempotent)
      become_user: ubuntu
      ansible.builtin.shell: >
        kubectl -n local-path-storage set image deployment/local-path-provisioner local-path-provisioner=rancher/local-path-provisioner:v0.0.32 || true
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: inventory_hostname == "k8s-master-01"
      run_once: true

    - name: Add control-plane toleration to local-path-provisioner deployment
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n local-path-storage patch deployment local-path-provisioner --type=json -p='[
          {"op": "add", "path": "/spec/template/spec/tolerations", "value": [
            {"key": "node-role.kubernetes.io/control-plane", "operator": "Exists", "effect": "NoSchedule"},
            {"key": "node-role.kubernetes.io/master", "operator": "Exists", "effect": "NoSchedule"}
          ]}
        ]' || true
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: inventory_hostname == "k8s-master-01"
      run_once: true

    - name: Wait for local-path-provisioner deployment rollout (tolerant, collect diagnostics on failure)
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=300s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: local_path_rollout
      failed_when: false
      changed_when: false
      when: inventory_hostname == "k8s-master-01"
      run_once: true

    - name: If rollout failed, collect local-path deployment diagnostics
      when: local_path_rollout is defined and local_path_rollout.rc != 0 and inventory_hostname == "k8s-master-01"
      block:
        - name: Get pods in local-path-storage
          become_user: ubuntu
          ansible.builtin.shell: kubectl -n local-path-storage get pods -o wide
          environment:
            KUBECONFIG: /home/ubuntu/.kube/config
          register: local_path_pods

        - name: Describe local-path-provisioner deployment
          become_user: ubuntu
          ansible.builtin.shell: kubectl -n local-path-storage describe deployment/local-path-provisioner
          environment:
            KUBECONFIG: /home/ubuntu/.kube/config
          register: local_path_deploy_desc

        - name: Get events in local-path-storage
          become_user: ubuntu
          ansible.builtin.shell: kubectl -n local-path-storage get events --sort-by='.lastTimestamp'
          environment:
            KUBECONFIG: /home/ubuntu/.kube/config
          register: local_path_events

        - name: For each pod, describe and fetch logs (all containers)
          become_user: ubuntu
          ansible.builtin.shell: |
            for p in $(kubectl -n local-path-storage get pods -o name | sed 's/^pod\\///'); do
              echo '==== POD: ' $p '===='
              kubectl -n local-path-storage describe pod $p || true
              for c in $(kubectl -n local-path-storage get pod $p -o jsonpath='{.spec.containers[*].name}'); do
                echo '---- LOGS for container:' $c '----'
                kubectl -n local-path-storage logs $p -c $c --tail=200 || true
              done
            done
          environment:
            KUBECONFIG: /home/ubuntu/.kube/config
          register: local_path_pod_details

        - name: Show diagnostics
          ansible.builtin.debug:
            msg:
              - "rollout: {{ local_path_rollout.stdout | default('') }}"
              - "pods: {{ local_path_pods.stdout | default('') }}"
              - "deployment_describe: {{ local_path_deploy_desc.stdout | default('') }}"
              - "events: {{ local_path_events.stdout | default('') }}"
              - "pod_details: {{ local_path_pod_details.stdout | default('') }}"

        - name: Fail with diagnostic summary
          ansible.builtin.fail:
            msg: "local-path-provisioner rollout failed; see diagnostics above"

    - name: Check reclaimPolicy of local-path StorageClass
      become_user: ubuntu
      ansible.builtin.shell: >
        kubectl get storageclass local-path -o jsonpath='{.reclaimPolicy}'
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: local_path_reclaim
      failed_when: false
      changed_when: false
      run_once: true
      when: inventory_hostname == "k8s-master-01"

    - name: Try to replace local-path StorageClass (force replace) if not Retain
      become_user: ubuntu
      ansible.builtin.shell: >
        kubectl get storageclass local-path -o yaml | sed '/^status:/,$d' | sed 's/reclaimPolicy: Delete/reclaimPolicy: Retain/' | kubectl replace --force -f -
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: sc_replace_try
      failed_when: false
      changed_when: sc_replace_try.rc == 0
      when: local_path_reclaim.stdout != 'Retain' and inventory_hostname == "k8s-master-01"
      run_once: true

    - name: Recreate local-path StorageClass with reclaimPolicy=Retain (fallback if replace fails)
      become_user: ubuntu
      ansible.builtin.shell: >
        kubectl get storageclass local-path -o yaml | sed '/^status:/,$d' | sed 's/reclaimPolicy: Delete/reclaimPolicy: Retain/' > /tmp/local-path-sc.yaml && kubectl delete storageclass local-path --ignore-not-found && kubectl apply -f /tmp/local-path-sc.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: sc_recreate
      failed_when: sc_recreate.rc != 0
      when: sc_replace_try is defined and sc_replace_try.rc is defined and sc_replace_try.rc != 0 and local_path_reclaim.stdout != 'Retain' and inventory_hostname == "k8s-master-01"
      run_once: true

    - name: Verify reclaimPolicy is Retain (with retries)
      become_user: ubuntu
      ansible.builtin.shell: kubectl get storageclass local-path -o jsonpath='{.reclaimPolicy}'
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: local_path_reclaim_after
      retries: 6
      delay: 5
      until: local_path_reclaim_after.stdout == 'Retain'
      failed_when: local_path_reclaim_after.stdout != 'Retain'
      when: inventory_hostname == "k8s-master-01"
      run_once: true

# 5. Install Metrics Server
- name: Install Metrics Server
  hosts: k8s-master-01
  become: true
  tasks:
    - name: Check if metrics-server is already installed
      become_user: ubuntu
      ansible.builtin.shell: kubectl get deployment metrics-server -n kube-system -o name
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metrics_server_check
      failed_when: false
      changed_when: false

    - name: Download metrics-server manifest
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml"
        dest: /tmp/metrics-server-components.yaml
        mode: '0644'
      when: metrics_server_check.rc != 0

    - name: Apply metrics-server manifest
      become_user: ubuntu
      ansible.builtin.command: kubectl apply -f /tmp/metrics-server-components.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: metrics_server_check.rc != 0

    - name: Wait for metrics-server deployment to be created
      become_user: ubuntu
      ansible.builtin.shell: |
        for i in {1..30}; do
          if kubectl get deployment metrics-server -n kube-system -o name 2>/dev/null; then
            exit 0
          fi
          sleep 2
        done
        exit 1
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: metrics_server_check.rc != 0

    - name: Patch metrics-server with kubelet-insecure-tls flags
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl patch deployment metrics-server -n kube-system --type='json' -p='[
          {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value":"--kubelet-insecure-tls"},
          {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value":"--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname"}
        ]'
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metrics_patch
      failed_when: false
      changed_when: "'patched' in metrics_patch.stdout"

    - name: Wait for metrics-server rollout
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n kube-system rollout status deployment/metrics-server --timeout=120s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metrics_rollout
      retries: 3
      delay: 10
      until: metrics_rollout.rc == 0

    - name: Verify metrics-server is working
      become_user: ubuntu
      ansible.builtin.shell: |
        for i in {1..12}; do
          if kubectl top nodes 2>/dev/null; then
            echo "Metrics server is working!"
            exit 0
          fi
          echo "Waiting for metrics to be available... (attempt $i/12)"
          sleep 10
        done
        echo "Warning: Metrics not yet available, but server is deployed"
        exit 0
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metrics_test
      changed_when: false

    # ------- MetalLB installation -------
    - name: Add MetalLB Helm repository
      become_user: ubuntu
      ansible.builtin.shell: |
        helm repo add metallb https://metallb.github.io/metallb
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: helm_add
      changed_when: "'has been added' in helm_add.stdout"
      failed_when: false

    - name: Update Helm repositories
      become_user: ubuntu
      ansible.builtin.shell: |
        helm repo update
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Check if MetalLB is already installed
      become_user: ubuntu
      ansible.builtin.shell: helm list -n metallb-system | grep metallb
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metallb_check
      failed_when: false
      changed_when: false

    - name: Install or update MetalLB via Helm
      become_user: ubuntu
      ansible.builtin.shell: |
        helm upgrade --install metallb metallb/metallb \
          --namespace metallb-system \
          --create-namespace
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: helm_install
      changed_when: "'deployed successfully' in helm_install.stdout or 'STATUS: deployed' in helm_install.stdout or 'upgraded' in helm_install.stdout"
      failed_when: helm_install.rc != 0

    - name: Wait for MetalLB deployment
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n metallb-system rollout status deployment/metallb-controller --timeout=120s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metallb_rollout
      retries: 3
      delay: 10
      until: metallb_rollout.rc == 0

    - name: Create MetalLB configuration (IPAddressPool and L2Advertisement)
      become_user: ubuntu
      ansible.builtin.copy:
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default
            namespace: metallb-system
          spec:
            addresses:
            - 192.168.1.21-192.168.1.31

          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default
            namespace: metallb-system
          spec:
            ipAddressPools:
            - default
        dest: /tmp/metallb-config.yaml
        mode: '0644'

    - name: Apply MetalLB configuration
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl apply -f /tmp/metallb-config.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metallb_config
      changed_when: "'created' in metallb_config.stdout or 'configured' in metallb_config.stdout"

    # ------- MetalLB robust verification -------
    - name: Verify MetalLB controller and speaker pods are Running
      become_user: ubuntu
      ansible.builtin.shell: |
        for i in {1..30}; do
          echo "Checking MetalLB pods (attempt $i/30)..."
          CONTROLLER=$(kubectl -n metallb-system get pods -l app.kubernetes.io/component=controller -o jsonpath='{.items[0].status.phase}' 2>/dev/null)
          SPEAKER=$(kubectl -n metallb-system get pods -l app.kubernetes.io/component=speaker -o jsonpath='{.items[0].status.phase}' 2>/dev/null)
          
          if [[ "$CONTROLLER" == "Running" && "$SPEAKER" == "Running" ]]; then
            echo "MetalLB controller and speaker are Running!"
            exit 0
          fi
          
          echo "Controller: $CONTROLLER, Speaker: $SPEAKER"
          sleep 5
        done
        echo "ERROR: MetalLB pods did not reach Running state"
        exit 1
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metallb_pods_check

    - name: Verify IPAddressPool is created and active
      become_user: ubuntu
      ansible.builtin.shell: |
        for i in {1..15}; do
          echo "Checking IPAddressPool status (attempt $i/15)..."
          STATUS=$(kubectl -n metallb-system get ipaddresspool default -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null)
          
          if [[ "$STATUS" == "True" ]]; then
            echo "IPAddressPool is available!"
            exit 0
          fi
          
          echo "IPAddressPool status: $STATUS"
          sleep 3
        done
        echo "ERROR: IPAddressPool did not become available"
        exit 1
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metallb_ippool_check

    - name: Verify L2Advertisement is created
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n metallb-system get l2advertisement default -o jsonpath='{.metadata.name}' | grep -q default
        if [ $? -eq 0 ]; then
          echo "L2Advertisement is present"
          exit 0
        else
          echo "ERROR: L2Advertisement is missing"
          exit 1
        fi
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metallb_l2_check

    - name: Display global MetalLB status
      become_user: ubuntu
      ansible.builtin.shell: |
        echo "=== MetalLB Status ==="
        kubectl -n metallb-system get pods
        echo ""
        echo "=== IPAddressPool Status ==="
        kubectl -n metallb-system get ipaddresspool
        echo ""
        echo "=== L2Advertisement Status ==="
        kubectl -n metallb-system get l2advertisement
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: metallb_status
      changed_when: false

    - name: Display MetalLB summary
      ansible.builtin.debug:
        msg: "{{ metallb_status.stdout }}"

    # ------- Nginx Ingress installation -------
    - name: Add ingress-nginx Helm repository
      become_user: ubuntu
      ansible.builtin.shell: |
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: helm_add_nginx
      changed_when: "'has been added' in helm_add_nginx.stdout"
      failed_when: false

    - name: Update Helm repositories
      become_user: ubuntu
      ansible.builtin.shell: |
        helm repo update
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Install or update nginx-ingress via Helm with LoadBalancer
      become_user: ubuntu
      ansible.builtin.shell: |
        helm upgrade --install nginx-ingress ingress-nginx/ingress-nginx \
          --namespace ingress-nginx \
          --create-namespace \
          --set controller.service.type=LoadBalancer
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: helm_install_nginx
      changed_when: "'deployed successfully' in helm_install_nginx.stdout or 'STATUS: deployed' in helm_install_nginx.stdout or 'upgraded' in helm_install_nginx.stdout"
      failed_when: helm_install_nginx.rc != 0

    - name: Wait for nginx-ingress deployment
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n ingress-nginx rollout status deployment/nginx-ingress-ingress-nginx-controller --timeout=120s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: nginx_rollout
      retries: 3
      delay: 10
      until: nginx_rollout.rc == 0

# 6. Install ArgoCD
- name: Install ArgoCD
  hosts: k8s-master-01
  become: true
  tasks:
    - name: Create argocd namespace
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config

    - name: Install ArgoCD CRDs
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl apply -k https://github.com/argoproj/argo-cd/manifests/crds?ref=stable
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: argocd_crds
      failed_when: false
      changed_when: "'created' in argocd_crds.stdout or 'configured' in argocd_crds.stdout"

    - name: Install ArgoCD in argocd namespace
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: argocd_install
      retries: 3
      delay: 5
      until: argocd_install.rc == 0

    - name: Wait for all ArgoCD pods to be ready
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n argocd wait --for=condition=ready pod -l app.kubernetes.io/part-of=argocd --timeout=600s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: argocd_wait
      retries: 3
      delay: 10
      until: argocd_wait.rc == 0
      ignore_errors: true

    - name: Check ArgoCD pods (non-blocking)
      become_user: ubuntu
      ansible.builtin.shell: kubectl -n argocd get pods
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: pods_check
      changed_when: false

    - name: Check ArgoCD deployments
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n argocd get deployments
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: deployments_check
      changed_when: false

    - name: Display ArgoCD status
      become_user: ubuntu
      ansible.builtin.shell: |
        echo "=== ArgoCD Pods Status ==="
        kubectl -n argocd get pods
        echo ""
        echo "=== ArgoCD Services ==="
        kubectl -n argocd get svc
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: argocd_status
      changed_when: false

    - name: Display ArgoCD summary
      ansible.builtin.debug:
        msg: "{{ argocd_status.stdout }}"

    - name: Retrieve initial ArgoCD password (admin)
      become_user: ubuntu
      ansible.builtin.shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: argocd_password
      changed_when: false

    - name: Display ArgoCD login credentials
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "ArgoCD Installation Complete!"
          - "=========================================="
          - "Username: admin"
          - "Password: {{ argocd_password.stdout }}"
          - ""
          - "Access ArgoCD:"
          - "1. Via port-forward: kubectl port-forward -n argocd svc/argocd-server 8080:443"
          - "   then: https://localhost:8080"
          - ""
          - "2. Via LoadBalancer (if configured): kubectl get svc -n argocd argocd-server"
          - ""
          - "⚠️  IMPORTANT: Change the initial password after first login!"
          - "=========================================="

    - name: Create optional Ingress for ArgoCD (LoadBalancer)
      become_user: ubuntu
      ansible.builtin.copy:
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-server-ingress
            namespace: argocd
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
              nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          spec:
            rules:
            - host: argocd.example.com
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 443
        dest: /tmp/argocd-ingress.yaml
        mode: '0644'

    - name: Note about ArgoCD Ingress
      ansible.builtin.debug:
        msg:
          - "An optional Ingress file has been created: /tmp/argocd-ingress.yaml"
          - "To apply it with your domain:"
          - "  1. Edit 'argocd.example.com' with your actual domain"
          - "  2. Install cert-manager if you want automatic HTTPS"
          - "  3. Run: kubectl apply -f /tmp/argocd-ingress.yaml"

# 7. Deploy Guacamole via ArgoCD
- name: Deploy Guacamole with ArgoCD
  hosts: k8s-master-01
  become: true
  tasks:
    - name: Install git if absent
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Clone argocd-guacamole-gitops repository
      become_user: ubuntu
      ansible.builtin.git:
        repo: "https://github.com/kyos-hell/argocd-guacamole-gitops.git"
        dest: "/home/ubuntu/argocd-guacamole-gitops"
        version: main
        update: true
      register: git_clone

    - name: Verify that guacamole.yaml file exists
      ansible.builtin.stat:
        path: "/home/ubuntu/argocd-guacamole-gitops/argocd/apps/guacamole.yaml"
      register: guacamole_yaml

    - name: Apply Guacamole manifest
      become_user: ubuntu
      ansible.builtin.command: kubectl apply -f /home/ubuntu/argocd-guacamole-gitops/argocd/apps/guacamole.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: guacamole_apply
      when: guacamole_yaml.stat.exists

    - name: Display Guacamole deployment result
      ansible.builtin.debug:
        msg: "{{ guacamole_apply.stdout }}"
      when: guacamole_yaml.stat.exists

    - name: Wait for Guacamole resources to be created
      become_user: ubuntu
      ansible.builtin.shell: |
        sleep 5
        kubectl get all -A | grep -i guacamole || echo "Guacamole resources being created..."
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: guacamole_check
      changed_when: false

    - name: Display created resources
      ansible.builtin.debug:
        msg: "{{ guacamole_check.stdout }}"

    - name: Success message for Guacamole
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Guacamole Deployment Started!"
          - "=========================================="
          - "Repository cloned: /home/ubuntu/argocd-guacamole-gitops"
          - "Manifest applied: argocd/apps/guacamole.yaml"
          - ""
          - "To check the status:"
          - "  kubectl get all -A | grep -i guacamole"
          - ""
          - "To view deployment logs:"
          - "  kubectl logs -f deployment/<deployment-name> -n <namespace>"
          - "=========================================="
